{% extends 'base.html' %}
{% block title %}Editar lançamento · Grana{% endblock %}
{% block content %}
<header class="page-head"><div><span class="eyebrow">{{ item.description }}</span><h1>Editar lançamento</h1><p>Corrija os dados sem perder a origem do registro.</p></div><a class="secondary-button" href="{{ url_for('main.transactions') }}">← Voltar</a></header>
<section class="panel narrow-panel"><form method="post" class="form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="span-2">Descrição<input name="description" value="{{ item.description }}" required></label><label>Valor<input name="amount" value="{{ '%.2f'|format(item.amount)|replace('.',',') }}" required></label>
  <label>Tipo<select name="kind"><option value="expense" {{ 'selected' if item.kind=='expense' }}>Saída</option><option value="income" {{ 'selected' if item.kind=='income' }}>Entrada</option></select></label>
  <label>Data<input type="date" name="transaction_date" value="{{ item.transaction_date.isoformat() }}" required></label>
  <label>Categoria<select name="category_id"><option value="">Sem categoria</option>{% for row in categories %}<option value="{{ row.id }}" {{ 'selected' if item.category_id==row.id }}>{{ row.full_name }}</option>{% endfor %}</select></label>
  <label>Conta<select name="account_id"><option value="">Nenhuma</option>{% for row in accounts %}<option value="{{ row.id }}" {{ 'selected' if item.account_id==row.id }}>{{ row.name }}</option>{% endfor %}</select></label>
  <label>Cartão<select name="card_id"><option value="">Nenhum</option>{% for row in cards %}<option value="{{ row.id }}" {{ 'selected' if item.card_id==row.id }}>{{ row.name }}</option>{% endfor %}</select></label>
  <label>Quem paga?<select name="payment_responsibility" id="payment-responsibility"><option value="self" {{ 'selected' if item.payment_responsibility=='self' }}>Eu</option><option value="parents" {{ 'selected' if item.payment_responsibility=='parents' }}>Meus pais</option><option value="shared" {{ 'selected' if item.payment_responsibility=='shared' }}>Dividido</option></select></label>
  <label id="personal-amount-field">Minha parte<input name="personal_amount" value="{{ '%.2f'|format(item.personal_amount if item.personal_amount is not none else item.amount)|replace('.',',') }}"></label>
  <label>Parcela atual<input type="number" name="installment_current" value="{{ item.installment_current or '' }}"></label><label>Total de parcelas<input type="number" name="installment_total" value="{{ item.installment_total or '' }}"></label>
  <label class="span-2">Observações<textarea name="notes">{{ item.notes }}</textarea></label><div class="form-actions span-2"><button class="primary-button">Salvar alterações</button></div>
</form></section>
<script>
(()=>{const select=document.getElementById('payment-responsibility'),field=document.getElementById('personal-amount-field');const sync=()=>field.hidden=select.value!=='shared';select.addEventListener('change',sync);sync()})();
</script>
{% endblock %}

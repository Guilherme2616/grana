{% extends 'base.html' %}{% block title %}Editar investimento · Grana{% endblock %}{% block content %}
<header class="page-head"><div><span class="eyebrow">{{ item.asset }}</span><h1>Editar operação</h1><p>Atualize os dados registrados.</p></div><a class="secondary-button" href="{{ url_for('main.investments') }}">← Voltar</a></header><section class="panel narrow-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Operação<select name="operation">{% for value in ['Compra','Venda','Recebimento'] %}<option {{ 'selected' if item.operation == value }}>{{ value }}</option>{% endfor %}</select></label><label>Categoria<input name="category" value="{{ item.category }}" required></label><label>Subcategoria<input name="subcategory" value="{{ item.subcategory }}"></label><label>Ativo<input name="asset" value="{{ item.asset }}" required></label><label>Quantidade<input name="quantity" value="{{ ('%.8f'|format(item.quantity)).rstrip('0').rstrip('.')|replace('.', ',') }}" required></label><label>Valor unitário<input name="unit_value" value="{{ '%.2f'|format(item.unit_value)|replace('.', ',') }}" required></label><label>Data<input type="date" name="operation_date" value="{{ item.operation_date.isoformat() }}" required></label><label>Observações<input name="notes" value="{{ item.notes }}"></label><div class="form-actions span-2"><button class="primary-button">Salvar alterações</button></div></form></section>{% endblock %}
